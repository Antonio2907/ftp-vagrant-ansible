---
- name: Provisionar el servidor FTP
  hosts: negocio
  become: true
  vars:
    cert_dir: "/etc/ssl/ftp"
    domain_name: "antonio.test"
  vars_files:
    - vars/vault.yml

  tasks:
    - name: Instalar vsftpd y las dependencias criptográficas
      ansible.builtin.apt:
        name:
          - vsftpd
          - python3-cryptography
        state: present
        update_cache: true

    - name: Crear grupo de usuarios FTP
      ansible.builtin.group:
        name: ftpusers
        state: present

    - name: Crear grupo de publicación web
      ansible.builtin.group:
        name: webpublish
        state: present

    - name: Crear usuarios FTP
      ansible.builtin.user:
        name: "{{ item }}"
        groups: ftpusers
        append: true
        create_home: true
        shell: /bin/bash
        password: "{{ ftp_password_hashes[item] }}"
        state: present
      loop:
        - juan
        - ana

    - name: Añadir a ana al grupo de publicación web
      ansible.builtin.user:
        name: ana
        groups: webpublish
        append: true

    - name: Preparar el document root para la publicación de ana
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        owner: root
        group: webpublish
        mode: "2775"

    - name: Asignar permisos al archivo de prueba para el grupo webpublish
      ansible.builtin.file:
        path: /var/www/html/index.html
        owner: root
        group: webpublish
        mode: "0664"
        state: file
      ignore_errors: false

    - name: Crear directorio para los certificados
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        mode: "0755"

    - name: Generar clave privada RSA
      community.crypto.openssl_privatekey:
        path: "{{ cert_dir }}/{{ domain_name }}.key"
        type: RSA
        size: 2048
        mode: "0600"

    - name: Generar Solicitud de Firma de Certificado (CSR)
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ cert_dir }}/{{ domain_name }}.key"
        common_name: "{{ domain_name }}"
        organization_name: "Mi Empresa"
        subject_alt_name:
          - "DNS:{{ domain_name }}"
          - "DNS:ftp.{{ domain_name }}"
          - "DNS:www.{{ domain_name }}"
      register: csr
      changed_when: false

    - name: Generar certificado X.509 autofirmado
      community.crypto.x509_certificate:
        path: "{{ cert_dir }}/{{ domain_name }}.crt"
        privatekey_path: "{{ cert_dir }}/{{ domain_name }}.key"
        csr_content: "{{ csr.csr }}"
        provider: selfsigned
        selfsigned_not_after: "+365d"
        mode: "0644"

    - name: Crear directorio de configuración por usuario
      ansible.builtin.file:
        path: /etc/vsftpd_user_conf
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Fijar el directorio inicial de ana en /var/www/html
      ansible.builtin.copy:
        content: "local_root=/var/www/html\n"
        dest: /etc/vsftpd_user_conf/ana
        owner: root
        group: root
        mode: "0644"
      notify: Reiniciar vsftpd

    - name: Copiar los usuarios no enjaulados
      ansible.builtin.copy:
        src: files/vsftpd.chroot_list
        dest: /etc/vsftpd.chroot_list
        owner: root
        group: root
        mode: "0644"
      notify: Reiniciar vsftpd

    - name: Copiar configuración de vsftpd
      ansible.builtin.copy:
        src: files/vsftpd.conf
        dest: /etc/vsftpd.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reiniciar vsftpd

    - name: Habilitar e iniciar vsftpd
      ansible.builtin.service:
        name: vsftpd
        enabled: true
        state: started

  handlers:
    - name: Reiniciar vsftpd
      ansible.builtin.service:
        name: vsftpd
        state: restarted
