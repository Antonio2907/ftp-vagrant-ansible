[defaults]
# Usuario SSH por defecto: Vagrant crea siempre el usuario "vagrant".
remote_user = vagrant
# Inventario por defecto, así no hace falta escribir -i inventory.yml.
inventory = inventory.yml
# Desactiva la comprobación de la huella SSH del servidor. Solo para esta
# práctica: las VM se destruyen y recrean y cambiarían la huella cada vez.
# No debe usarse en producción. No afecta a la validación de certificados TLS.
host_key_checking = False
interpreter_python = auto_silent